name: nomad_cloud_compiler
description: "Service de compilation de NomadIDE : reçoit un projet Arduino (zip), le compile dans un conteneur Docker verrouillé et renvoie les binaires."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  archive: ^4.0.2
  crypto: ^3.0.3
  nomad_compile_api:
    path: ../../packages/nomad_compile_api
  path: ^1.9.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
