name: nomad_mcu
description: NomadIDE — IDE embarqué léger (MicroPython & C/C++) pour mobile et desktop.
publish_to: none
version: 0.4.0+5
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  nomad_hal:
    path: ../packages/nomad_hal
  nomad_protocols:
    path: ../packages/nomad_protocols
  nomad_editor:
    path: ../packages/nomad_editor
  nomad_compile_api:
    path: ../packages/nomad_compile_api
  nomad_cloud_compiler:
    path: ../services/cloud_compiler
  shelf: ^1.4.1
  archive: ^4.0.2
  crypto: ^3.0.3
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_localizations:
    sdk: flutter
  intl: any
  file_selector: ^1.1.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/nomad_logo.png
