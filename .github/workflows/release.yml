name: Release

# Un tag `v*` (ex. `v0.1.0`) compile l'app pour Windows, Linux et macOS et publie une release GitHub avec
# les fichiers et les notes de `CHANGELOG.md`. Une PR qui modifie ce fichier compile les trois versions
# sans rien publier : le workflow est vérifié avant le premier tag.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # 22.04 plutôt que « latest » : un binaire ne tourne que sur des systèmes dont la glibc est au moins aussi récente
          # que celle de la machine qui l'a compilé. Avec 22.04, l'AppImage tourne aussi sur Debian 12, Ubuntu 22.04…
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - name: Outils de compilation Linux (GTK, CMake, Ninja)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libudev-dev

      - name: Outils de compilation macOS (libserialport se compile avec autotools)
        if: matrix.platform == 'macos'
        run: brew install automake libtool

      - name: Numéro de version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-pr${{ github.event.number }}"; fi
          # Les métadonnées Windows et macOS n'acceptent que des chiffres : « 0.1.0-beta.1 » → « 0.1.0 ».
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NAME=${VERSION%%-*}" >> "$GITHUB_ENV"

      - name: Dépendances (workspace)
        run: flutter pub get

      - name: Compilation
        working-directory: app
        shell: bash
        run: flutter build ${{ matrix.platform }} --release --build-name="$BUILD_NAME" --build-number=${{ github.run_number }}

      - name: Archive Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "NomadIDE-$env:VERSION-windows-x64.zip"

      - name: Archive Linux
        if: matrix.platform == 'linux'
        run: tar -czf "NomadIDE-$VERSION-linux-x64.tar.gz" -C app/build/linux/x64/release/bundle .

      # AppImage : un seul fichier, qui se lance sur la plupart des distributions sans installation (chmod +x puis double clic).
      # GTK 3 et libudev viennent du système, comme pour l'archive ; le reste du dossier « bundle » est dedans.
      - name: AppImage Linux
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          APPDIR="$RUNNER_TEMP/NomadIDE.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r app/build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp docs/brand/play/icon-512-dark.png "$APPDIR/nomadide.png"
          cat > "$APPDIR/nomadide.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NomadIDE
          Comment=Éditeur pour cartes ESP32 et RP2040 (MicroPython, C/C++)
          Exec=nomad_mcu
          Icon=nomadide
          Categories=Development;IDE;Electronics;
          Terminal=false
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/nomad_mcu" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          # Outil de packaging épinglé : version et empreinte vérifiées avant de l'exécuter.
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          # Pas de FUSE sur les machines de CI : l'outil s'extrait lui-même avant de s'exécuter.
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run "$APPDIR" "NomadIDE-$VERSION-linux-x86_64.AppImage"

      - name: Vérification de l'AppImage
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          FILE="NomadIDE-$VERSION-linux-x86_64.AppImage"
          chmod +x "$FILE"
          "./$FILE" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/nomad_mcu
          test -d squashfs-root/usr/bin/data/flutter_assets
          test -f squashfs-root/nomadide.desktop
          # Chaque bibliothèque dont l'exécutable dépend doit se trouver (dans le dossier lib/ de l'app ou sur le système).
          if LD_LIBRARY_PATH="$PWD/squashfs-root/usr/bin/lib" ldd squashfs-root/usr/bin/nomad_mcu | grep "not found"; then
            echo "::error::Bibliothèque manquante dans l'AppImage"; exit 1
          fi
          rm -rf squashfs-root
          ls -l "$FILE"

      - name: Archive macOS
        if: matrix.platform == 'macos'
        run: ditto -c -k --keepParent app/build/macos/Build/Products/Release/*.app "NomadIDE-$VERSION-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: nomadide-${{ matrix.platform }}
          path: NomadIDE-*
          if-no-files-found: error

  android:
    name: build (android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true

      - name: Numéro de version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-pr${{ github.event.number }}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NAME=${VERSION%%-*}" >> "$GITHUB_ENV"

      # Clé de signature des versions publiées (secrets du dépôt) : sans elle, la publication est refusée,
      # car un APK signé avec une clé de debug ne pourrait pas être mis à jour.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : voir README, « Publier une version »."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Dépendances (workspace)
        run: flutter pub get

      - name: Compilation (APK par architecture et App Bundle pour le Play Store)
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --build-name="$BUILD_NAME" --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number=${{ github.run_number }}

      - name: Fichiers à publier
        run: |
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "NomadIDE-$VERSION-android-arm64.apk"
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "NomadIDE-$VERSION-android-arm32.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "NomadIDE-$VERSION-android.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: nomadide-android
          path: NomadIDE-*
          if-no-files-found: error

  publish:
    needs: [build, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes de version (CHANGELOG.md)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # La section « ## [VERSION] … » jusqu'à la suivante.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Version $VERSION." > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: NomadIDE ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          # Toute version 0.x est une pré-version (bêta).
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
